services:
  bonsai2:
    image: localhost/bonsai2-server:prism-b10754
    build:
      # Context is the repo root so both stacks share docker/.
      context: ..
      dockerfile: docker/Dockerfile
    container_name: bonsai2
    ports:
      - "8080:8080"
    volumes:
      # Named volume: weights survive `compose down` and re-`up`. Holds .gguf only.
      - bonsai2-models:/models
    # Compose auto-reads ./.env only to expand ${VAR} inside this file.
    # Putting those vars INSIDE the container needs this line.
    env_file:
      - .env
    # The RTX 3060 only (/dev/nvidia0, card1/renderD129, PCI 0000:0d:00.0).
    # Swap for the UUID name if device indices ever shift:
    #   nvidia.com/gpu=GPU-eee1bf52-918c-4f2d-2898-7af735f2a8c8
    devices:
      - nvidia.com/gpu=0
    # SELinux on Bazzite blocks the nvidia device nodes otherwise.
    security_opt:
      - label=disable
    # Docker / older podman instead of the `devices` line above:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           device_ids: ["0"]
    #           capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m

volumes:
  bonsai2-models:
